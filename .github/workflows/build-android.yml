name: Build Android APK

on:
  push:
    branches: [main]
    paths-ignore:
      - 'deliveries/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: raki-stock-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android project files
        run: |
          flutter create . --platforms=android --org=com.rakishop
          rm -f test/widget_test.dart

      - name: Restore stable release signing key
        env:
          RAKI_KEYSTORE_BASE64: ${{ secrets.RAKI_KEYSTORE_BASE64 }}
          RAKI_KEYSTORE_PASSWORD: ${{ secrets.RAKI_KEYSTORE_PASSWORD }}
          RAKI_KEY_ALIAS: ${{ secrets.RAKI_KEY_ALIAS }}
        run: |
          test -n "$RAKI_KEYSTORE_BASE64" || { echo "RAKI_KEYSTORE_BASE64 is missing"; exit 1; }
          test -n "$RAKI_KEYSTORE_PASSWORD" || { echo "RAKI_KEYSTORE_PASSWORD is missing"; exit 1; }
          test -n "$RAKI_KEY_ALIAS" || { echo "RAKI_KEY_ALIAS is missing"; exit 1; }
          printf '%s' "$RAKI_KEYSTORE_BASE64" | base64 --decode > android/raki-stock-release.jks
          keytool -list \
            -keystore android/raki-stock-release.jks \
            -storepass "$RAKI_KEYSTORE_PASSWORD" \
            -alias "$RAKI_KEY_ALIAS" >/dev/null

      - name: Configure Firebase, signing and release shrinker
        run: |
          if [ -f google-services.json ]; then
            cp google-services.json android/app/google-services.json
          fi
          cat > android/app/proguard-rules.pro <<'RULES'
          # The Flutter ML Kit plugin references optional script recognizers.
          # Raki Stock only ships the Latin recognizer, so these optional classes
          # are intentionally absent and should not fail R8.
          -dontwarn com.google.mlkit.vision.text.chinese.**
          -dontwarn com.google.mlkit.vision.text.devanagari.**
          -dontwarn com.google.mlkit.vision.text.japanese.**
          -dontwarn com.google.mlkit.vision.text.korean.**
          RULES
          python3 - <<'PY'
          from pathlib import Path

          settings = Path('android/settings.gradle.kts')
          text = settings.read_text()
          marker = 'id("dev.flutter.flutter-plugin-loader") version "1.0.0"'
          addition = marker + '\n    id("com.google.gms.google-services") version "4.4.4" apply false'
          if 'com.google.gms.google-services' not in text:
              text = text.replace(marker, addition)
              settings.write_text(text)

          app = Path('android/app/build.gradle.kts')
          text = app.read_text()
          plugin_marker = 'id("dev.flutter.flutter-gradle-plugin")'
          plugin_addition = plugin_marker + '\n    id("com.google.gms.google-services")'
          if 'com.google.gms.google-services' not in text:
              text = text.replace(plugin_marker, plugin_addition)

          text = text.replace('minSdk = flutter.minSdkVersion', 'minSdk = 24')

          build_types_marker = '    buildTypes {'
          release_signing = '\n'.join([
              '    signingConfigs {',
              '        create("release") {',
              '            storeFile = file("../raki-stock-release.jks")',
              '            storePassword = System.getenv("RAKI_KEYSTORE_PASSWORD")',
              '            keyAlias = System.getenv("RAKI_KEY_ALIAS")',
              '            keyPassword = System.getenv("RAKI_KEY_PASSWORD")',
              '        }',
              '    }',
              '',
          ])
          if 'create("release")' not in text:
              if build_types_marker not in text:
                  raise SystemExit('Could not locate buildTypes in Android Gradle file')
              text = text.replace(build_types_marker, release_signing + build_types_marker, 1)

          debug_signing = 'signingConfig = signingConfigs.getByName("debug")'
          release_signing_line = 'signingConfig = signingConfigs.getByName("release")'
          if debug_signing in text:
              text = text.replace(debug_signing, release_signing_line, 1)
          elif release_signing_line not in text:
              raise SystemExit('Could not locate release signingConfig in Android Gradle file')

          proguard = release_signing_line + '\n            proguardFiles(\n                getDefaultProguardFile("proguard-android-optimize.txt"),\n                "proguard-rules.pro",\n            )'
          if 'proguard-rules.pro' not in text:
              text = text.replace(release_signing_line, proguard, 1)
          app.write_text(text)
          PY

      - name: Check owner website JavaScript and Firebase UI contract
        run: |
          node --input-type=module --check < owner-web/app.js
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          import re
          class IDs(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.ids = set()
              def handle_starttag(self, tag, attrs):
                  for key, value in attrs:
                      if key == 'id':
                          self.ids.add(value)
          parser = IDs()
          parser.feed(Path('owner-web/index.html').read_text())
          source = Path('owner-web/app.js').read_text()
          references = set(re.findall(r'\$\("([A-Za-z0-9-]+)"\)', source))
          missing = references - parser.ids
          if missing:
              raise SystemExit(f'Owner web missing element IDs: {sorted(missing)}')
          print(f'Checked {len(references)} referenced owner-web elements.')
          PY

      - name: Get dependencies
        run: flutter pub get

      - name: Test V2 product identity
        run: flutter test test/v2_registration_identity_test.dart

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Build optimized release APKs
        env:
          RAKI_KEYSTORE_PASSWORD: ${{ secrets.RAKI_KEYSTORE_PASSWORD }}
          RAKI_KEY_ALIAS: ${{ secrets.RAKI_KEY_ALIAS }}
          RAKI_KEY_PASSWORD: ${{ secrets.RAKI_KEY_PASSWORD }}
        run: |
          test -n "$RAKI_KEY_PASSWORD" || { echo "RAKI_KEY_PASSWORD is missing"; exit 1; }
          flutter build apk --release --split-per-abi

      - name: Prepare small APK artifacts
        run: |
          mkdir -p deliveries
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk deliveries/Raki-Stock-v2-arm64-v8a.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk deliveries/Raki-Stock-v2-armeabi-v7a.apk
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk deliveries/Raki-Stock-v2-x86_64.apk
          ls -lh deliveries

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Raki-Stock-v2-release
          path: deliveries/*.apk
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Publish latest 32-bit APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="raki-stock-v2-latest"
          APK="deliveries/Raki-Stock-v2-armeabi-v7a.apk"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" --clobber
            gh release edit "$TAG" --title "Raki Stock V2 - Latest 32-bit APK" --notes "Latest successful Raki Stock 32-bit Android build from main."
          else
            gh release create "$TAG" "$APK" --target "$GITHUB_SHA" --title "Raki Stock V2 - Latest 32-bit APK" --notes "Latest successful Raki Stock 32-bit Android build from main."
          fi
