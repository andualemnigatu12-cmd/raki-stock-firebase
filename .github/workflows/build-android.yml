name: Build Android APK

on:
  push:
    branches: [main]
    paths-ignore:
      - 'deliveries/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android project files
        run: |
          flutter create . --platforms=android --org=com.rakishop
          rm -f test/widget_test.dart

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Build release APK
        run: flutter build apk --release

      - name: Save APK in repository
        run: |
          mkdir -p deliveries
          cp build/app/outputs/flutter-apk/app-release.apk deliveries/Raki-Stock-Firebase-v1.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deliveries/Raki-Stock-Firebase-v1.apk
          if ! git diff --cached --quiet; then
            git commit -m "Save latest Android APK"
            git push
          fi
