name: Build Android APK

on:
  push:
    branches: [main]
    paths-ignore:
      - 'deliveries/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android project files
        run: |
          flutter create . --platforms=android --org=com.rakishop
          rm -f test/widget_test.dart

      - name: Configure Firebase Android
        if: hashFiles('google-services.json') != ''
        run: |
          cp google-services.json android/app/google-services.json
          python3 - <<'PY'
          from pathlib import Path

          settings = Path('android/settings.gradle.kts')
          text = settings.read_text()
          marker = 'id("dev.flutter.flutter-plugin-loader") version "1.0.0"'
          addition = marker + '\n    id("com.google.gms.google-services") version "4.4.4" apply false'
          if 'com.google.gms.google-services' not in text:
              text = text.replace(marker, addition)
              settings.write_text(text)

          app = Path('android/app/build.gradle.kts')
          text = app.read_text()
          marker = 'id("dev.flutter.flutter-gradle-plugin")'
          addition = marker + '\n    id("com.google.gms.google-services")'
          if 'com.google.gms.google-services' not in text:
              text = text.replace(marker, addition)
              app.write_text(text)
          PY

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Build installable test APK
        run: flutter build apk --debug

      - name: Prepare APK artifact
        run: |
          mkdir -p deliveries
          cp build/app/outputs/flutter-apk/app-debug.apk deliveries/Raki-Stock-Firebase-v1.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Raki-Stock-Firebase-v1
          path: deliveries/Raki-Stock-Firebase-v1.apk
          if-no-files-found: error
          retention-days: 30
