name: Build Android APK

on:
  push:
    branches: [main]
    paths-ignore:
      - 'deliveries/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      RAKI_KEYSTORE_BASE64: ${{ secrets.RAKI_KEYSTORE_BASE64 }}
      RAKI_KEYSTORE_PASSWORD: ${{ secrets.RAKI_KEYSTORE_PASSWORD }}
      RAKI_KEY_ALIAS: ${{ secrets.RAKI_KEY_ALIAS }}
      RAKI_KEY_PASSWORD: ${{ secrets.RAKI_KEY_PASSWORD }}
      RAKI_KEYSTORE_PATH: /tmp/raki-release.jks
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android project files
        run: |
          flutter create . --platforms=android --org=com.rakishop
          rm -f test/widget_test.dart

      - name: Configure Firebase, signing and release shrinker
        run: |
          if [ -f google-services.json ]; then
            cp google-services.json android/app/google-services.json
          fi

          if [ -n "$RAKI_KEYSTORE_BASE64" ]; then
            printf '%s' "$RAKI_KEYSTORE_BASE64" | base64 --decode > "$RAKI_KEYSTORE_PATH"
            chmod 600 "$RAKI_KEYSTORE_PATH"
            echo "Stable release signing key loaded."
          else
            echo "Stable signing secrets not configured yet; development build will use debug signing."
          fi

          cat > android/app/proguard-rules.pro <<'RULES'
          # The Flutter ML Kit plugin references optional script recognizers.
          # Raki Stock only ships the Latin recognizer, so these optional classes
          # are intentionally absent and should not fail R8.
          -dontwarn com.google.mlkit.vision.text.chinese.**
          -dontwarn com.google.mlkit.vision.text.devanagari.**
          -dontwarn com.google.mlkit.vision.text.japanese.**
          -dontwarn com.google.mlkit.vision.text.korean.**
          RULES
          python3 - <<'PY'
          from pathlib import Path

          settings = Path('android/settings.gradle.kts')
          text = settings.read_text()
          marker = 'id("dev.flutter.flutter-plugin-loader") version "1.0.0"'
          addition = marker + '\n    id("com.google.gms.google-services") version "4.4.4" apply false'
          if 'com.google.gms.google-services' not in text:
              text = text.replace(marker, addition)
              settings.write_text(text)

          app = Path('android/app/build.gradle.kts')
          text = app.read_text()
          plugin_marker = 'id("dev.flutter.flutter-gradle-plugin")'
          plugin_addition = plugin_marker + '\n    id("com.google.gms.google-services")'
          if 'com.google.gms.google-services' not in text:
              text = text.replace(plugin_marker, plugin_addition)

          # camera 0.12.x targets Android SDK 24+.
          text = text.replace('minSdk = flutter.minSdkVersion', 'minSdk = 24')

          signing_block = '''    signingConfigs {
        create("release") {
            val releaseStore = System.getenv("RAKI_KEYSTORE_PATH")
            if (!releaseStore.isNullOrEmpty() && file(releaseStore).exists()) {
                storeFile = file(releaseStore)
                storePassword = System.getenv("RAKI_KEYSTORE_PASSWORD")
                keyAlias = System.getenv("RAKI_KEY_ALIAS")
                keyPassword = System.getenv("RAKI_KEY_PASSWORD")
            }
        }
    }

'''
          if 'create("release")' not in text:
              text = text.replace('    buildTypes {', signing_block + '    buildTypes {')

          debug_signing = 'signingConfig = signingConfigs.getByName("debug")'
          conditional_signing = '''signingConfig = if (
                !System.getenv("RAKI_KEYSTORE_PATH").isNullOrEmpty() &&
                file(System.getenv("RAKI_KEYSTORE_PATH")).exists()
            ) signingConfigs.getByName("release") else signingConfigs.getByName("debug")'''
          text = text.replace(debug_signing, conditional_signing)

          signing_marker = conditional_signing
          proguard = signing_marker + '''\n            proguardFiles(\n                getDefaultProguardFile("proguard-android-optimize.txt"),\n                "proguard-rules.pro",\n            )'''
          if 'proguard-rules.pro' not in text:
              text = text.replace(signing_marker, proguard)
          app.write_text(text)
          PY

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Build optimized release APKs
        run: flutter build apk --release --split-per-abi

      - name: Prepare small APK artifacts
        run: |
          mkdir -p deliveries
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk deliveries/Raki-Stock-v2-arm64-v8a.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk deliveries/Raki-Stock-v2-armeabi-v7a.apk
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk deliveries/Raki-Stock-v2-x86_64.apk
          ls -lh deliveries

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Raki-Stock-v2-release
          path: deliveries/*.apk
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Publish latest 32-bit APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="raki-stock-v2-latest"
          APK="deliveries/Raki-Stock-v2-armeabi-v7a.apk"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" --clobber
            gh release edit "$TAG" \
              --title "Raki Stock V2 - Latest 32-bit APK" \
              --notes "Latest successful Raki Stock 32-bit Android build from main."
          else
            gh release create "$TAG" "$APK" \
              --target "$GITHUB_SHA" \
              --title "Raki Stock V2 - Latest 32-bit APK" \
              --notes "Latest successful Raki Stock 32-bit Android build from main."
          fi
