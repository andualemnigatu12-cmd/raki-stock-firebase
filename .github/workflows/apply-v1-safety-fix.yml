name: Apply V1 Safety Fix

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/apply-v1-safety-fix.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch count-item deletion safety
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('lib/features/stock/stock_review_page.dart')
          text = path.read_text()
          text = text.replace(
              'Delete "$name" from this count and also remove its linked product from Products?',
              'Delete "$name" from this stock count? The approved product will stay in Products.',
          )
          text = text.replace(
              'deleteLinkedProduct: alreadyAdded,',
              'deleteLinkedProduct: false,',
          )
          path.write_text(text)
          PY

      - name: Commit patch
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/features/stock/stock_review_page.dart
          git commit -m "Protect master products when deleting count items"
          git push origin HEAD:main
