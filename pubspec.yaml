name: raki_stock_firebase
description: Offline-first inventory and stock counting app for Raki Shop.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.12.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^4.15.0
  firebase_auth: ^6.7.0
  cloud_firestore: ^6.10.0
  firebase_storage: ^13.6.0
  image_picker: ^1.2.4
  google_mlkit_text_recognition: ^0.17.1
  shared_preferences: ^2.5.3
  path_provider: ^2.1.5
  path: ^1.9.1
  uuid: ^4.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
