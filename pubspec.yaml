name: raki_stock_firebase
description: Offline-first inventory and stock counting app for Raki Shop.
publish_to: "none"
version: 0.3.1+4

environment:
  sdk: ">=3.12.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^4.15.0
  firebase_auth: ^6.7.0
  cloud_firestore: ^6.10.0
  camera: ^0.12.1
  google_mlkit_text_recognition: ^0.17.1
  google_mlkit_barcode_scanning: ^0.16.1
  path_provider: ^2.1.5
  path: ^1.9.1
  uuid: ^4.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
